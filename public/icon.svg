<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background with safe zone -->
  <rect width="512" height="512" rx="110" fill="url(#grad1)"/>
  <circle cx="256" cy="256" r="180" fill="#ffffff" opacity="0.08"/>
  
  <!-- Clipboard Body -->
  <g filter="url(#shadow)" transform="translate(106, 86)">
    <!-- Main Board -->
    <rect x="0" y="40" width="300" height="340" rx="24" fill="#ffffff"/>
    
    <!-- Top Clip -->
    <rect x="80" y="20" width="140" height="40" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="4"/>
    <rect x="110" y="32" width="80" height="16" rx="8" fill="#1e40af"/>
    
    <!-- Header decorative line -->
    <rect x="40" y="90" width="130" height="14" rx="7" fill="#1e40af"/>
    <rect x="180" y="90" width="80" height="14" rx="7" fill="#94a3b8"/>
    
    <!-- Row 1: Checkmark item -->
    <circle cx="55" cy="145" r="15" fill="#10b981"/>
    <path d="M48 145 L53 150 L63 139" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <rect x="85" y="138" width="175" height="14" rx="7" fill="#334155"/>

    <!-- Row 2: Checkmark item -->
    <circle cx="55" cy="195" r="15" fill="#10b981"/>
    <path d="M48 195 L53 200 L63 189" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <rect x="85" y="188" width="145" height="14" rx="7" fill="#334155"/>

    <!-- Row 3: Warning/Sick item -->
    <circle cx="55" cy="245" r="15" fill="#f59e0b"/>
    <text x="55" y="251" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">S</text>
    <rect x="85" y="238" width="160" height="14" rx="7" fill="#334155"/>

    <!-- Row 4: Summary bar -->
    <rect x="40" y="295" width="220" height="42" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
    <!-- Attendance badges -->
    <rect x="52" y="304" width="45" height="24" rx="6" fill="#dcfce7"/>
    <text x="74" y="320" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#166534" text-anchor="middle">28 H</text>
    
    <rect x="105" y="304" width="45" height="24" rx="6" fill="#fef3c7"/>
    <text x="127" y="320" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#92400e" text-anchor="middle">1 S</text>

    <rect x="158" y="304" width="45" height="24" rx="6" fill="#fee2e2"/>
    <text x="180" y="320" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#991b1b" text-anchor="middle">1 A</text>
  </g>
</svg>
